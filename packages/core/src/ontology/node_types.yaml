# Node types v2. Twelve types; every node carries a `kind` attribute (subtype) rather than a separate type.
# No `other`: an unknown type is emitted as candidate:<label> with a `type_parent` from this list and stored
# as the parent with the label kept on the mention.
person:
  label: Person
  identity_keys: [email, phone, handle, url, orcid, licence, registry_id]
organization:
  label: Organization
  kinds: [company, school, university, agency, nonprofit, club, team, court, fund, brand, party]
  identity_keys: [domain, url, registry_id]
place:
  label: Place
  kinds: [address, city, region, country, venue, parcel, coordinates]
  geocodable: true
  identity_keys: [parcel_id]
event:
  label: Event
  kinds: [conference, hearing, incident, fair, election, meeting, race, wedding, funeral, campaign, tender, vote]
document:
  label: Document
  kinds: [article, post, filing, record, transcript, page, book, paper, photo, video, audio, minutes, roster, listing]
  identity_keys: [url, doi, hash]
account:
  label: Account
  kinds: [email, phone, handle, domain, ip, wallet, username]
  identity_keys: [identifier]
artifact:
  label: Artifact
  kinds: [software, dataset, design, malware, product]
asset:
  label: Asset
  kinds: [vehicle, vessel, aircraft, property, artwork, patent, trademark]
  identity_keys: [registry_id]
position:
  label: Position
  description: An office reified when it outlives its holders and succession matters ("the 43rd governor").
credential:
  label: Credential
  kinds: [licence, degree, certification, award, visa, citizenship, clearance]
  identity_keys: [registry_id]
legal_matter:
  label: LegalMatter
  kinds: [case, filing, judgment, sanction, probate, eviction, restraining_order]
  identity_keys: [docket]
transaction:
  label: Transaction
  description: A money or asset flow reified only when it has > 2 parties or its own identity (tx hash, contract number, invoice).
  kinds: [sale, contract_award, transfer, auction, donation, investment]
  identity_keys: [registry_id]
