<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorldGraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f5f7fa; --ink:#14202e; --muted:#5b6878; --line:#d6dce6; --accent:#c9781a; --accent-ink:#fff;
  --person:#1f8a8a; --organization:#6b4fd8; --account:#c9781a; --place:#3f9d4e; --document:#7a8595; --legal_matter:#d0473b; --transaction:#b0642d; --other:#8b95a3;
  --established:#1f8a4c; --corroborated:#5aa33a; --single_source:#8f9aab; --unverified:#c4ccd8; --disputed:#d0473b;
  --shadow:0 12px 40px rgba(20,32,46,.14); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141b; --panel:#161c25; --panel2:#1c2330; --ink:#e6ebf2; --muted:#8c98a8; --line:#273140; --accent:#e39a3b; --accent-ink:#14202e;
  --person:#3fb3b3; --organization:#9d86f0; --account:#e39a3b; --place:#5fc06e; --document:#8f9bab; --legal_matter:#ef6b5e; --transaction:#d18a55; --other:#7c8798;
  --established:#37c46f; --corroborated:#8fd15a; --single_source:#7d8899; --unverified:#3a4556; --disputed:#ef6b5e; --shadow:0 12px 40px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
button.ghost{background:none;border:none;color:var(--muted);padding:6px 8px;min-height:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
::placeholder{color:var(--muted)}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.top{padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.top .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.top h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px calc(16px + var(--safe-b))}

/* home */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:grid;gap:4px}
.card:active{background:var(--panel2)}
.card .t{font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .t .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;flex:none}
.card .g{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.card .m b{color:var(--ink);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.form{display:grid;gap:10px}
.form label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;display:grid;gap:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tabs */
.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));flex:none;gap:4px}
.tabs button{flex:1;border:none;background:none;color:var(--muted);font-size:12.5px;padding:8px 4px;border-radius:10px;min-height:44px}
.tabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:500}
.pane{position:absolute;inset:0;display:none;flex-direction:column}
.pane.on{display:flex}

/* graph */
#stage{flex:1;position:relative;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#legend{position:absolute;left:10px;bottom:10px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:10.5px;display:grid;grid-template-columns:auto auto;gap:1px 12px;opacity:.95}
#legend .r{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap}
#legend .dot{width:8px;height:8px;border-radius:50%}
#legend .ln{width:14px;border-top:3px solid}
#gtools{position:absolute;top:8px;left:8px;right:8px;z-index:3;display:flex;gap:6px}
#gtools input{flex:1;padding:8px 12px}
#gtools button{padding:6px 12px}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);max-height:70%;transform:translateY(104%);transition:transform .22s ease;display:flex;flex-direction:column}
#sheet.open{transform:none}
#sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px;flex:none}
#sheet .hd{padding:4px 16px 8px;flex:none;display:flex;align-items:flex-start;gap:8px}
#sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;flex:1;text-wrap:balance}
#sheet .type{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:7px;align-items:center;margin-top:2px}
#sheet .type .sw{width:8px;height:8px;border-radius:50%;display:inline-block}
#sheet .keys{font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:2px}
#sbody{overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(16px + var(--safe-b));flex:1}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:500}
.rowi{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.rowi .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rowi .o{font-weight:500;text-align:right}
.rowi .p{color:var(--muted);font-size:12px}
.rowi .m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gchip{font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:5px;color:#fff;letter-spacing:.02em}
.q{font-size:10.5px;color:var(--muted);background:var(--panel2);padding:1px 6px;border-radius:5px}
.sc{font-size:10px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:0 5px;border-radius:5px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.why{font-size:11px;color:var(--accent);background:none;border:none;padding:0;min-height:0}
.ev{margin-top:6px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px}
.ev .c{padding:6px 0;border-top:1px solid var(--line)}
.ev .c:first-child{border-top:none;padding-top:0}
.ev .src{color:var(--muted);font-size:10.5px;display:flex;gap:6px;flex-wrap:wrap}
.ev blockquote{margin:3px 0;padding-left:8px;border-left:2px solid var(--accent);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-word}
.ev a{color:var(--accent);font-size:10.5px;word-break:break-all}

/* ask / run / report */
.chat{display:flex;flex-direction:column;gap:12px}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:100%}
.bubble.me{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:color-mix(in srgb,var(--accent) 35%,var(--line));align-self:flex-end}
.bubble .who{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px;font-weight:500}
.md{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.md h1,.md h2,.md h3{font-size:14px;margin:10px 0 2px;font-weight:600}
.md code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;background:var(--panel2);padding:0 4px;border-radius:4px}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));background:var(--panel);border-top:1px solid var(--line);flex:none}
.composer textarea{flex:1;min-height:44px;max-height:120px}
.log{font:12px/1.5 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.log .agent{color:var(--ink)}
.log .tool{color:var(--accent)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.pill.live{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style></head>
<body>

<!-- HOME -->
<section class="screen on" id="s-home">
  <div class="top"><div class="grow"><div class="eyebrow">WorldGraph</div><h1>Investigations</h1></div><button class="primary" id="btn-new">New</button></div>
  <div class="body pad" id="home-body"><div class="empty">Loading…</div></div>
</section>

<!-- NEW -->
<section class="screen" id="s-new">
  <div class="top"><button class="ghost" data-go="home">‹ Back</button><div class="grow"><h1>New investigation</h1></div></div>
  <div class="body pad">
    <div class="form">
      <label>Subject<input id="f-seed" placeholder="a name, a domain, a company"></label>
      <div class="row2">
        <label>Kind<select id="f-kind"><option>person</option><option>organization</option><option>domain</option></select></label>
        <label>Ceiling ($)<input id="f-ceiling" type="number" inputmode="decimal" value="3" min="0.5" step="0.5"></label>
      </div>
      <label>What do you want to know?<textarea id="f-goal" rows="3" placeholder="Learn everything about … who runs it, what it is, related people and companies, anything suspicious."></textarea></label>
      <label>A starting URL (optional)<input id="f-url" placeholder="https://"></label>
      <button class="primary" id="f-go">Create and start the investigator</button>
      <div class="log" id="new-log"></div>
    </div>
  </div>
</section>

<!-- INVESTIGATION -->
<section class="screen" id="s-inv">
  <div class="top"><button class="ghost" data-go="home">‹</button><div class="grow"><h1 id="inv-title"></h1><div class="sub" id="inv-sub"></div></div><span class="pill" id="inv-live" hidden>live</span></div>
  <div class="grow" style="position:relative;min-height:0">
    <div class="pane on" id="p-graph">
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="gtools"><input id="find" placeholder="Find an entity…" autocomplete="off"><button id="btn-fit">Fit</button></div>
        <div id="legend"></div>
        <div id="sheet"><div class="grip"></div><div class="hd"><div class="grow"><h2 id="sh-name"></h2><div class="type" id="sh-type"></div><div class="keys mono" id="sh-keys"></div></div><button class="ghost" id="sh-close" aria-label="close">✕</button></div><div id="sbody"></div></div>
      </div>
    </div>
    <div class="pane" id="p-ask">
      <div class="body pad chat" id="ask-body"><div class="empty">Ask the graph anything about this investigation. A one-shot analyst reads the graph and answers with cited evidence.</div></div>
      <div class="composer"><textarea id="ask-q" rows="1" placeholder="Who runs it and how sure are we?"></textarea><button class="primary" id="ask-go">Ask</button></div>
    </div>
    <div class="pane" id="p-report">
      <div class="body pad" id="report-body"><div class="empty">No report yet. Run the investigator.</div></div>
    </div>
    <div class="pane" id="p-run">
      <div class="body pad">
        <div class="form" style="margin-bottom:12px">
          <div class="row2"><label>Ceiling ($)<input id="run-ceiling" type="number" inputmode="decimal" value="3" min="0.5" step="0.5"></label><label>Model<select id="run-model"><option value="sonnet-5">Sonnet 5</option><option value="sonnet-5-medium">Sonnet 5 (medium)</option><option value="haiku-4-5">Haiku 4.5</option><option value="opus-5">Opus 5</option></select></label></div>
          <button class="primary" id="run-go">Start the investigator</button>
        </div>
        <div class="log" id="run-log"></div>
      </div>
    </div>
  </div>
  <div class="tabs"><button class="on" data-tab="graph">Graph</button><button data-tab="ask">Ask</button><button data-tab="report">Report</button><button data-tab="run">Run</button></div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888";
const TYPES = ["person","organization","account","place","document","legal_matter","transaction"];
const GRADES = ["established","corroborated","single_source","unverified","disputed"];
const GLABEL = {established:"established",corroborated:"corroborated",single_source:"single source",unverified:"unverified",disputed:"disputed"};
const typeVar = (t) => "--" + (TYPES.includes(t) ? t : "other");
async function api(u, opt) { const r = await fetch(u, opt); if (!r.ok) throw new Error(await r.text()); return r.json(); }
const md = (t) => esc(t).replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");

/* ---------- routing ---------- */
let INV = null, META = null, live = 0;
function show(id) { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === "s-" + id)); }
document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { location.hash = b.dataset.go === "home" ? "#/" : "#/" + b.dataset.go; });
$("#btn-new").onclick = () => { location.hash = "#/new"; };
function route() {
  const h = location.hash || "#/";
  const m = /^#\/inv\/([0-9a-f-]+)(?:\/(\w+))?/.exec(h);
  if (m) { openInv(m[1], m[2] || "graph"); return; }
  if (h === "#/new") { show("new"); return; }
  show("home"); loadHome();
}
addEventListener("hashchange", route);

/* ---------- home ---------- */
async function loadHome() {
  const list = await api("/api/investigations");
  const el = $("#home-body");
  if (!list.length) { el.innerHTML = `<div class="empty">No investigations yet. Tap New.</div>`; return; }
  el.innerHTML = list.map((i) => `<div class="card" data-id="${i.id}">
    <div class="t"><span>${esc(i.seed?.name || i.title)}</span><span class="k">${esc(i.seed?.kind || "")}</span></div>
    <div class="g">${esc(i.goal || "")}</div>
    <div class="m"><span><b>${i.entities}</b> entities</span><span><b>${i.stats?.relations ?? 0}</b> links</span>${i.reports ? `<span><b>${i.reports}</b> report${i.reports === 1 ? "" : "s"}</span>` : ""}<span>${esc(String(i.created_at).slice(0, 10))}</span></div>
  </div>`).join("");
  el.querySelectorAll(".card").forEach((c) => c.onclick = () => { location.hash = "#/inv/" + c.dataset.id; });
}

/* ---------- new ---------- */
$("#f-go").onclick = () => {
  const seed = $("#f-seed").value.trim(), goal = $("#f-goal").value.trim(), kind = $("#f-kind").value, url = $("#f-url").value.trim(), ceiling = $("#f-ceiling").value;
  if (!seed || !goal) { alert("Give a subject and a goal."); return; }
  const log = $("#new-log"); log.textContent = "";
  let created = null;
  sse("/api/create", { seed, kind, goal, url: url || undefined }, (line) => { const m = /investigation ([0-9a-f]+) created/.exec(line); if (m) created = m[1]; appendLog(log, line); }, async () => {
    if (!created) { appendLog(log, "— could not create —"); return; }
    const list = await api("/api/investigations"); const inv = list.find((i) => i.id.startsWith(created));
    if (!inv) return;
    location.hash = "#/inv/" + inv.id + "/run";
    setTimeout(() => startAgent(inv.id, ceiling, "sonnet-5"), 400);
  });
};

/* ---------- SSE ---------- */
function sse(url, body, onLine, onDone) {
  live++; $("#inv-live").hidden = false;
  fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) }).then(async (r) => {
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); const parts = buf.split("\n\n"); buf = parts.pop();
      for (const p of parts) { const ev = /event: (\w+)/.exec(p), dm = /data: (.*)/s.exec(p); if (!dm) continue; const data = JSON.parse(dm[1]);
        if (ev && ev[1] === "done") { live--; if (live <= 0) { live = 0; $("#inv-live").hidden = true; } onDone?.(); } else onLine(data); } }
  }).catch((e) => { live = Math.max(0, live - 1); onLine("error: " + e.message); onDone?.(); });
}
function appendLog(el, t) { const line = document.createElement("div"); if (/^\s*·/.test(t)) line.className = "agent"; else if (/^\s*▸/.test(t)) line.className = "tool"; line.textContent = t; el.appendChild(line); el.scrollIntoView?.({ block: "end" }); const body = el.closest(".body"); if (body) body.scrollTop = body.scrollHeight; }

/* ---------- investigation ---------- */
let G = null, nodes = [], links = [], nmap = new Map(), byEnt = new Map(), edgesBy = new Map(), attrsBy = new Map();
async function openInv(id, tab) {
  show("inv");
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === "p-" + tab));
  if (INV !== id) {
    INV = id; closeSheet(); $("#ask-body").innerHTML = `<div class="empty">Ask the graph anything about this investigation. A one-shot analyst reads the graph and answers with cited evidence.</div>`; $("#run-log").textContent = "";
    const list = await api("/api/investigations"); META = list.find((i) => i.id === id) || null;
    $("#inv-title").textContent = META?.seed?.name || "";
    await loadGraph();
  }
  if (tab === "report") loadReport();
  if (tab === "graph") { resize(); setTimeout(fit, 200); }
}
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { location.hash = "#/inv/" + INV + "/" + b.dataset.tab; });
async function loadGraph() {
  G = await api("/api/graph/" + INV);
  byEnt = new Map(G.entities.map((e) => [e.id, e]));
  nodes = G.entities.map((e) => ({ ...e, x: W()/2 + (Math.random()-.5)*500, y: H()/2 + (Math.random()-.5)*500, vx: 0, vy: 0, r: 5 + Math.min(20, Math.sqrt(+e.claims || 1) * 3) }));
  nmap = new Map(nodes.map((n) => [n.id, n]));
  links = G.links.map((l) => ({ ...l, a: nmap.get(l.s), b: nmap.get(l.o) })).filter((l) => l.a && l.b);
  edgesBy = new Map(); for (const l of links) for (const k of [l.s, l.o]) (edgesBy.get(k) || edgesBy.set(k, []).get(k)).push(l);
  attrsBy = new Map(); for (const a of G.attrs) (attrsBy.get(a.e) || attrsBy.set(a.e, []).get(a.e)).push(a);
  $("#inv-sub").textContent = `${nodes.length} entities · ${links.length} links · ${G.sources} sources`;
  $("#legend").innerHTML = TYPES.filter((t) => nodes.some((n) => n.type === t)).map((t) => `<div class="r"><span class="dot" style="background:${cssv("--" + t)}"></span>${t.replace("_", " ")}</div>`).join("") + GRADES.slice(0, 3).map((g) => `<div class="r"><span class="ln" style="border-color:${cssv("--" + g)}"></span>${GLABEL[g]}</div>`).join("");
  hot = 300; setTimeout(fit, 900);
}

/* ---------- canvas ---------- */
const canvas = $("#c"), ctx = canvas.getContext("2d");
const W = () => canvas.clientWidth || innerWidth, H = () => canvas.clientHeight || innerHeight;
let scale = 1, ox = 0, oy = 0, dragging = null, selected = null, ptrs = new Map(), last = null, pinch = 0, moved = false, down = null, hot = 300;
function resize() { const dpr = Math.min(2, devicePixelRatio || 1); canvas.width = W()*dpr; canvas.height = H()*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", resize); resize();
function step() {
  if (!nodes.length || hot <= 0) return; hot--;
  for (let i = 0; i < nodes.length; i++) { const a = nodes[i];

/* ---------- dossier sheet ---------- */
const gchip = (g) => `<span class="gchip" style="background:${cssv("--" + (g || "single_source"))}">${GLABEL[g] || g}</span>`;
